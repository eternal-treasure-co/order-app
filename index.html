  }

  var MAX = 10;
  function fails() { try { return Number(localStorage.getItem("rc.gate.fail") || 0); } catch (x) { return 0; } }
  function locked() {
    f.innerHTML = '<div style="color:#c62828;font-size:18px;line-height:1.6">密碼錯誤太多次,這支手機已無法登入。<br>請聯絡管理者。</div>';
  }
  f.onsubmit = function (e) {
    e.preventDefault();
    if (fails() >= MAX) return locked();
    var pw = document.getElementById("p").value; if (!pw) return;
    m.style.color = "#555"; m.textContent = "…";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(G.s), iterations: G.n, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }).then(function (key) {
      return dec(key).then(function (buf) {
        return crypto.subtle.exportKey("raw", key).then(function (raw) {
          try {
            localStorage.removeItem("rc.gate.fail");
            localStorage.setItem("rc.gate.k", btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
            localStorage.setItem("rc.gate.pw", JSON.stringify(pw));
          } catch (x) {}
          open_(buf);
        });
      });
    }).catch(function () {
      var n = fails() + 1; try { localStorage.setItem("rc.gate.fail", String(n)); } catch (x) {}
      if (n >= MAX) return locked();
      m.style.color = "#c62828"; m.textContent = "密碼不對(還可以試 " + (MAX - n) + " 次)";
    });
  };
  var k = null; try { k = localStorage.getItem("rc.gate.k"); } catch (x) {}
  if (!k || !window.crypto || !crypto.subtle) return showForm();
  crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]).then(dec).then(open_).catch(showForm);
})();
</script>
</body></html>
